name: KEUM concept engine validation
on:
  push:
    branches: [main]
    paths:
      - 'concept_engine/**'
      - 'data/catalog.json'
      - 'data/references.json'
      - 'vector_engine/graph_engine.py'
      - '.github/workflows/concepts.yml'
  pull_request:
    paths:
      - 'concept_engine/**'
      - 'data/catalog.json'
      - 'data/references.json'
      - 'vector_engine/graph_engine.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scientific and esoteric bibliography
        run: python3 concept_engine/validate_bibliography.py
      - name: Generate bibliography provenance audit
        run: python3 concept_engine/audit_bibliography.py
      - name: Produce offline source reconciliation queue
        run: python3 concept_engine/reconcile_sources.py --output build/bibliography/reconciliation.json
      - name: Test all 581 instances
        run: python3 -m unittest discover -s concept_engine -p 'test_*.py' -v
      - name: Generate 581-entry provenance ledger
        run: python3 concept_engine/provenance.py --output build/provenance_581.json
      - name: Export all 581 SVG, JSON, glTF
        run: python3 concept_engine/export_all.py --output build/concepts
      - name: Validate manifest and all exported artifacts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/concepts")
          data=json.loads((p/"manifest.json").read_text())
          assert len(data)==581
          provenance=json.loads(Path('build/provenance_581.json').read_text())
          assert provenance['concept_count']==581
          assert len(list(p.glob("keum-*.svg")))==581
          assert len(list(p.glob("keum-*.json")))==581
          assert len(list(p.glob("keum-*.gltf")))==581
          print("validated 581 x 3 exports")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: keum-bibliography-audit
          path: |
            data/bibliography_audit.json
            build/bibliography/reconciliation.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: keum-581-models
          path: build/concepts/
          retention-days: 30
