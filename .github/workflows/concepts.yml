name: KEUM concept engine validation
on:
  push:
    branches: [main]
    paths:
      - 'concept_engine/**'
      - 'data/catalog.json'
      - 'data/references.json'
      - 'vector_engine/graph_engine.py'
      - '.github/workflows/concepts.yml'
  pull_request:
    paths:
      - 'concept_engine/**'
      - 'data/catalog.json'
      - 'vector_engine/graph_engine.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scientific and esoteric bibliography
        run: python3 concept_engine/validate_bibliography.py
      - name: Test all 493 instances
        run: python3 -m unittest discover -s concept_engine -p 'test_*.py' -v
      - name: Generate 493-entry provenance ledger
        run: python3 concept_engine/provenance.py --output build/provenance_493.json
      - name: Export all 493 SVG, JSON, glTF
        run: python3 concept_engine/export_all.py --output build/concepts
      - name: Validate manifest and all exported artifacts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/concepts")
          data=json.loads((p/"manifest.json").read_text())
          assert len(data)==493
          provenance=json.loads(Path('build/provenance_493.json').read_text())
          assert provenance['concept_count']==493
          assert len(list(p.glob("keum-*.svg")))==493
          assert len(list(p.glob("keum-*.json")))==493
          assert len(list(p.glob("keum-*.gltf")))==493
          print("validated 493 x 3 exports")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: keum-493-models
          path: build/concepts/
          retention-days: 30
