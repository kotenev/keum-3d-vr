site_name: KEUM — Mathematical & Architecture Reference
site_description: Формальная математическая и программная архитектура символической Kathara–Eckasha модели
site_url: https://kotenev.github.io/keum-3d-vr/
repo_url: https://github.com/kotenev/keum-3d-vr
repo_name: kotenev/keum-3d-vr
docs_dir: mkdocs
site_dir: site
theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.highlight
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Обзор: index.md
  - Методология: methodology.md
  - Архитектура:
      - Системный контекст: architecture/system.md
      - Компоненты и данные: architecture/components.md
      - Контракты и форматы: architecture/contracts.md
  - Математика:
      - Аксиомы и пространства: mathematics/foundations.md
      - Графы и потоки: mathematics/graphs.md
      - Динамика и резонанс: mathematics/dynamics.md
      - Геометрия и проекции: mathematics/geometry.md
      - Топология и численные методы: mathematics/numerics.md
      - TeX и MathML: mathematics/mathml.md
  - Семейства моделей:
      - Космология и плотности: models/cosmology.md
      - Concave Earth и Звёздный глобус: models/concave-earth.md
      - Concave Earth Astronomy: models/concave-astronomy.md
      - Kathara, Lotus, Reuche: models/kathara-lotus.md
      - Merkaba, PCM и PKA: models/merkaba.md
      - Hova, DNA, Fire Codes: models/hova-dna.md
  - Реализация:
      - SVG и glTF: implementation/rendering.md
      - Исполняемый движок 412 концепций: implementation/concept-runtime.md
      - Индивидуальные модели и проверка точности: implementation/source-aware-models.md
      - Реконструкция 49 изображений: implementation/image-reconstruction.md
      - Дополнительные 10 изображений: implementation/additional-ten-images.md
      - Тестирование: implementation/testing.md
      - Прослеживаемость: implementation/traceability.md
  - Энциклопедия KEUM:
      - Космология: encyclopedia/cosmology.md
      - Сакральная геометрия: encyclopedia/geometry.md
      - Меркаба и поля: encyclopedia/merkaba.md
      - Дыхание и циклы: encyclopedia/cycles.md
      - Энергетическая анатомия: encyclopedia/anatomy.md
      - Планетарные модели: encyclopedia/planetary.md
      - Тела Hova: encyclopedia/hova.md
      - ДНК и коды: encyclopedia/dna-codes.md
      - Кристаллическое тело: encyclopedia/crystal.md
      - Пламена и Eukatharista: encyclopedia/flames.md
      - Спирали и вихри: encyclopedia/vortices.md
      - Проекции и голография: encyclopedia/projection.md
      - Матрицы излучения: encyclopedia/radiation.md
      - Коды и Christos: encyclopedia/christos.md
      - 10 новых изображений и 81 концепция: encyclopedia/additional-ten-images.md
  - Источники: bibliography.md
  - Глоссарий: glossary.md
