<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>KEUM Geometry Review</title><style>body{background:#0b1325;color:#e9f3ff;font:14px system-ui;margin:18px}button,input,select{margin:5px}#stage{position:relative;width:min(95vw,1100px);height:70vh;border:1px solid #567;overflow:hidden;background:#172339}#stage img,#stage svg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}#stage svg{pointer-events:auto}svg line,svg circle,svg polygon{cursor:pointer}svg .selected{stroke:#ff4444!important;stroke-width:5!important}pre{white-space:pre-wrap}</style></head><body><h1>KEUM · Проверка геометрии исходных схем</h1><p>Загрузите <code>candidates.json</code> и оригинальное изображение из соответствующего каталога. Геометрические кандидаты не являются подтверждённой реконструкцией.</p><label>Кандидаты JSON <input id="json" type="file" accept=".json"></label><label>Исходное изображение <input id="raster" type="file" accept="image/*"></label><label><input id="lines" type="checkbox" checked> Линии</label><label><input id="circles" type="checkbox" checked> Окружности</label><label><input id="polygons" type="checkbox" checked> Контуры</label><button id="export">Экспорт правок JSON</button><div id="stage"><img id="img"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div><p id="status">Нет загруженной схемы.</p><pre id="selection"></pre><script>
let data=null,selected=null;const $=id=>document.getElementById(id),svg=$('svg');
$('raster').onchange=e=>{let f=e.target.files[0];if(f)$('img').src=URL.createObjectURL(f)};
$('json').onchange=async e=>{let f=e.target.files[0];if(!f)return;data=JSON.parse(await f.text());selected=null;draw()};
for(const id of ['lines','circles','polygons'])$(id).onchange=draw;
function draw(){if(!data)return;let [w,h]=data.analysis_size;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();const ns='http://www.w3.org/2000/svg';const add=(tag,attrs,group,i)=>{let o=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))o.setAttribute(k,v);o.onclick=()=>{selected={group,index:i};$('selection').textContent=JSON.stringify(data.geometry[group][i],null,2);draw()};if(selected?.group===group&&selected.index===i)o.classList.add('selected');svg.append(o)};for(const [group,on] of [['lines',$('lines').checked],['circles',$('circles').checked],['polygons',$('polygons').checked]]){if(!on)continue;data.geometry[group].forEach((o,i)=>{if(o.rejected)return;if(group==='lines'){let [x1,y1,x2,y2]=o.xyxy;add('line',{x1,y1,x2,y2,stroke:'#15b7ff','stroke-width':2},group,i)}if(group==='circles')add('circle',{cx:o.cx,cy:o.cy,r:o.r,fill:'none',stroke:'#ffc74d','stroke-width':2},group,i);if(group==='polygons')add('polygon',{points:o.vertices.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#cb90ff','stroke-width':1.5},group,i)})}$('status').textContent=`Схема ${data.image_id} · линии ${data.geometry.lines.length}, окружности ${data.geometry.circles.length}, контуры ${data.geometry.polygons.length} · статус: ${data.status}`}
window.addEventListener('keydown',e=>{if(!data||!selected)return;if(e.key==='Delete'||e.key==='Backspace'){data.geometry[selected.group][selected.index].rejected=true;selected=null;draw()}});
$('export').onclick=()=>{if(!data)return alert('Сначала загрузите candidates.json');data.status='review-in-progress';data.manual_review=true;data.review_note='Candidate selection only; geometric fidelity not yet certified';let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`image_${String(data.image_id).padStart(2,'0')}_review.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
