<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEUM Vector Engine</title><style>body{font:15px system-ui;background:#0b1424;color:#e5eefc;margin:0}header{padding:22px 28px;background:#101e33}main{display:grid;grid-template-columns:270px 1fr;gap:20px;padding:22px}aside{background:#14233a;border-radius:14px;padding:20px;height:max-content}label{display:block;margin:14px 0 5px}select,input,button,a.download{background:#213956;color:white;border:1px solid #456582;border-radius:8px;padding:10px;width:100%;box-sizing:border-box}button,a.download{cursor:pointer;text-align:center;text-decoration:none;display:block;margin-top:12px}iframe{width:100%;height:min(76vh,900px);border:0;background:white;border-radius:12px}small{color:#a6b7ce}@media(max-width:650px){main{grid-template-columns:1fr}iframe{height:60vh}}</style></head><body><header><h2>KEUM · Vector Engine</h2><small>Воспроизводимые геометрические SVG · исследовательская символическая модель</small></header><main><aside><label>Семейство геометрии</label><select id="preset"><option>kathara</option><option>merkaba</option><option>lotus</option><option>reuche</option><option>crystal</option><option>clock</option><option>axiotonal</option><option>cosmology</option></select><label>Стиль</label><select id="theme"><option value="examples">Манускрипт</option><option value="examples_dark">Тёмный</option></select><a class="download" id="download" download>Скачать SVG</a><button onclick="location.href='../index.html'">Перейти в 3D-атлас</button><p><small>Параметры сложности, разрешения, подписей и оформления доступны через Python CLI. Схемы являются математическими визуализациями, а не подтверждёнными физическими полями.</small></p></aside><iframe id="preview" title="SVG preview"></iframe></main><script>const p=document.querySelector('#preset'),t=document.querySelector('#theme'),f=document.querySelector('#preview'),a=document.querySelector('#download');function update(){const u=`${t.value}/${p.value}.svg`;f.src=u;a.href=u;a.download=`keum_${p.value}.svg`}p.onchange=t.onchange=update;update()</script></body></html>
